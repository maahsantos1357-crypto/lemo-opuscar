<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>A Casa Sempre Ganha</title>
<style>
@font-face{font-family:Slab;src:url(fonts/alfa-slab-one-latin-400-normal.woff2) format('woff2');font-display:block}
@font-face{font-family:Bagel;src:url(fonts/bagel-fat-one-latin-400-normal.woff2) format('woff2');font-display:block}
@font-face{font-family:Arch;src:url(fonts/archivo-black-latin-400-normal.woff2) format('woff2');font-display:block}

</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, hash } from '/core/lib.js';
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = { paper: '#F2E8D5', navy: '#1B2238', pink: '#FF5A87', yellow: '#FFC62B', red: '#E3343F', green: '#2FA36B', blue: '#2E55D6', cream: '#FFF6E6', night2: '#2C3760' };
const F = { slab: 'Slab', bagel: 'Bagel', arch: 'Arch', mono: '800 1px Mono' };
const font = (fam, px) => fam === 'mono' ? `800 ${px}px Mono` : `${px}px ${F[fam]}`;

// ───────── timing (prep.py) ─────────
const TM = await (await fetch('timing.json')).json();
const L = Object.fromEntries(TM.lines.map(l => [l.id, l]));
const nrm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function WT(line, q, nth = 0) {                  // instante em que a palavra q começa na fala `line`
  const qs = nrm(q); let k = 0;
  for (const w of TM.words) if (w.line === line && nrm(w.w).startsWith(qs)) { if (k++ === nth) return w.t0; }
  console.warn('word not found', line, q); return L[line].t0;
}
const DUR = TM.dur;

// ───────── tempos-chave (imagem e som usam os mesmos) ─────────
const K = {};
K.c1 = L.L2.t0 - .35; K.c2 = L.L3.t0 - .35; K.c3 = L.L4.t0 - .35; K.c4 = L.L5.t0 - .3; K.c5 = L.L6.t0 - .35;
K.c6 = L.L7.t0 - .3; K.c7 = L.L8.t0 - .35; K.c8 = L.L9.t0 - .9; K.c9 = L.L10.t0 - .45; K.c10 = L.L13.t0 - .5; K.c11 = L.L13.t1 + .45 + 2.75;
K.buzz = [.25, WT('L1', 'Aposte') - .1]; K.notif = .55;
K.folder = K.c1 + .15; K.title = WT('L2', 'arquivo'); K.aberto = WT('L2', 'esquema') + .2;
K.hook = WT('L3', 'isca'); K.bonus = WT('L3', 'Bonus'); K.jersey = WT('L3', 'propaganda'); K.infl = WT('L3', 'influenciadores'); K.nunca = WT('L3', 'mostrando');
K.in100 = WT('L4', 'aposta'); K.margem = WT('L4', 'margem'); K.slot = WT('L4', 'cassinos'); K.spin = WT('L4', 'maquinas'); K.sai = WT('L4', 'devolver'); K.menos = WT('L4', 'menos');
K.chart0 = L.L5.t0; K.win = WT('L5', 'ganhar'); K.chartEnd = WT('L5', 'ganha');
K.people = WT('L6', 'Segundo'); K.bc = WT('L6', 'Banco'); K.n24 = WT('L6', '24');
K.n3 = WT('L7', '3'); K.bolsa = WT('L7', 'Bolsa'); K.coins = WT('L7', 'enviaram'); K.pix = WT('L7', 'bets');
K.dmg = [WT('L8', 'Dividas'), WT('L8', 'Nome'), WT('L8', 'Ansiedade'), WT('L8', 'Vicio')]; K.aluguel = WT('L8', 'aluguel'); K.mercado = WT('L8', 'mercado'); K.virando = WT('L8', 'virando');
K.redact = [WT('L9', 'quem'), WT('L9', 'realmente'), WT('L9', 'lucra')];
K.card1 = L.L10.t0 - .2; K.dif = WT('L10', 'diferenca'); K.card2 = L.L11.t0 - .35; K.perdem = WT('L11', 'perdem'); K.card3 = L.L12.t0 - .35; K.patro = WT('L12', 'patrocinio');
K.apost = WT('L12', 'apostador'); K.prej = WT('L12', 'prejuizo') + .15;
K.vered = L.L13.t0; K.sorte = WT('L13', 'sorte'); K.modelo = WT('L13', 'modelo'); K.desenh = WT('L13', 'desenhado'); K.casa = L.L13.t1 + .45;
K.drawer = K.c11; K.help = WT('L14', 'procure'); K.cvv = WT('L14', 'CVV'); K.fade = DUR - 1.2;

const CUTS = [
  { t: K.c1, col: C.yellow }, { t: K.c2, col: C.blue }, { t: K.c3, col: C.pink }, { t: K.c4, col: C.navy, hard: true },
  { t: K.c5, col: C.blue }, { t: K.c6, col: C.yellow, hard: true }, { t: K.c7, col: C.red }, { t: K.c8, col: C.navy },
  { t: K.c9, col: C.pink }, { t: K.c10, col: C.navy, hard: true }, { t: K.c11, col: C.yellow },
];
const SHAKES = [[K.aberto, 16, .4], [K.nunca, 8, .3], [K.n3, 18, .45], ...K.dmg.map(t => [t, 11, .35]), [K.prej, 12, .35], [K.casa, 26, .5], [K.n24, 10, .35]];
const FLASHES = [[K.notif, .35], [K.n3, .45], [K.casa, .5], [K.n24, .3]];

// ───────── eventos de som (exportados p/ mix.py) ─────────
const EV = [];
const ev = (t, type, o = {}) => EV.push({ t: +t.toFixed(3), type, ...o });
K.buzz.forEach(t => ev(t, 'buzz')); ev(K.notif, 'ding');
CUTS.forEach(c => ev(c.t - (c.hard ? 0 : .2), c.hard ? 'cut' : 'whoosh'));
ev(K.folder, 'paper'); ev(K.aberto, 'stamp', { big: 1 });
ev(K.hook, 'drop'); ev(K.bonus, 'coin'); ev(K.jersey, 'cloth'); ev(K.infl, 'pop'); ev(K.nunca, 'stamp');
ev(K.in100, 'coins'); ev(K.margem, 'pop'); ev(K.slot, 'thump'); ev(K.spin - .15, 'lever'); ev(K.spin, 'reels', { d: K.menos - K.spin + .3 });
[0, 1, 2].forEach(i => ev(K.menos + i * .18, 'reelstop')); ev(K.sai, 'pop'); ev(K.menos + .6, 'buzzer');
ev(K.chart0, 'pen', { d: K.chartEnd - K.chart0 + .3 }); ev(K.win, 'ding'); ev(K.chartEnd + .3, 'thump');
ev(K.bc, 'type'); ev(K.n24, 'shutter'); for (let i = 0; i < 12; i++) ev(K.people + i * .14, 'tick', { v: .35 });
ev(K.n3, 'shutter'); ev(K.n3, 'thump'); ev(K.bolsa, 'paper'); for (let i = 0; i < 10; i++) ev(K.coins + .12 * i, 'coin', { v: .45 }); ev(K.pix, 'pop');
K.dmg.forEach((t, i) => ev(t, 'stamp', { big: i === 3 ? 1 : 0 })); ev(K.aluguel, 'whoosh'); ev(K.mercado, 'whoosh'); ev(K.virando + .3, 'coins');
ev(K.c8 + .4, 'clock'); ev(K.c8 + 1.4, 'clock'); K.redact.forEach(t => ev(t, 'rip'));
[K.card1, K.card2, K.card3].forEach(t => ev(t + .25, 'pin')); ev(K.dif, 'string'); ev(K.perdem, 'string'); ev(K.patro, 'string');
ev(K.apost - .1, 'whoosh'); for (let i = 0; i < 14; i++) ev(K.apost + .5 + i * .16, 'coin', { v: .3 }); ev(K.prej, 'stamp');
ev(K.sorte, 'pop'); ev(K.modelo, 'pop'); ev(K.desenh, 'type'); ev(K.casa, 'stamp', { big: 1 });
ev(K.drawer + .1, 'drawer'); ev(K.help, 'pop'); ev(DUR - .7, 'drawerclose');
[[L.L8.t1 + .15, L.L9.t0], [L.L9.t1 + .1, L.L10.t0 - .2], [L.L13.t1 + .05, K.casa - .02]].forEach(([a, b]) => ev(a, 'silence', { d: +(b - a).toFixed(3) }));
EV.sort((a, b) => a.t - b.t);

// ───────── materiais ─────────
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const paperTex = (() => {      // multiplicado por cima de tudo: manchas, fibra, vinheta, dobra
  const c = mkCanvas(W, H), g = c.getContext('2d');
  const sm = mkCanvas(64, 36), sg = sm.getContext('2d'), id = sg.createImageData(64, 36);
  for (let i = 0; i < 64 * 36; i++) { const v = 238 + hash(i * 3.1) * 17; id.data.set([v, v - 2, v - 7, 255], i * 4); }
  sg.putImageData(id, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(sm, 0, 0, W, H);
  const im = g.getImageData(0, 0, W, H), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (hash(i * .37) - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  g.putImageData(im, 0, 0);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(150,130,105,.55)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(170,150,120,.18)'; g.fillRect(W * .5 - 1, 0, 2, H);
  g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(W * .5 + 1, 0, 3, H);
  return c;
})();
const off = mkCanvas(W, H), og = off.getContext('2d');

// boil: os pontos dos contornos tremem a 10 qps, posições suaves a 30
let BOIL = 0, bc = 0;
const J = (x, y, a = 1.7) => { bc++; return [x + (hash(bc * 1.37 + BOIL * 91.7) - .5) * 2 * a, y + (hash(bc * 2.71 + BOIL * 53.3) - .5) * 2 * a]; };
function rrPts(x, y, w, h, r, n = 5) {
  const p = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
const circPts = (cx, cy, r, n = 26) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * TAU) * r, cy + Math.sin(i / n * TAU) * r]);
function path(pts, close = true, a) { ctx.beginPath(); pts.forEach(([x, y], i) => { const [jx, jy] = J(x, y, a); i ? ctx.lineTo(jx, jy) : ctx.moveTo(jx, jy); }); if (close) ctx.closePath(); }
function shape(pts, fill, stroke = C.navy, lw = 7) { path(pts); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function line(pts, col = C.navy, lw = 7) { path(pts, false); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }

// retícula: grade girada de círculos, um único path; raio = densidade × passo × k
function halftone(g, box, step, ang, dens, col, k = .7) {
  const [x0, y0, x1, y1] = box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + step;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  g.fillStyle = col; g.beginPath();
  for (let i = -R; i <= R; i += step) for (let j = -R; j <= R; j += step) {
    const x = cx + i * ca - j * sa, y = cy + i * sa + j * ca;
    if (x < x0 - step || x > x1 + step || y < y0 - step || y > y1 + step) continue;
    const d = dens(x, y); if (d <= .03) continue;
    const r = Math.min(d, 1) * step * k; g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU);
  }
  g.fill();
}
const edgeD = (pw = 1, m = 260) => (x, y) => pw * Math.max(0, 1 - Math.min(x, y, W - x, H - y) / m);
const radialD = (cx, cy, r, pw = 1) => (x, y) => pw * Math.max(0, 1 - Math.hypot(x - cx, y - cy) / r);

// número / palavra gigante cheia de retícula
function dotText(str, x, y, px, fam, fill, dotCol, sc = 1, align = 'left') {
  og.setTransform(1, 0, 0, 1, 0, 0); og.clearRect(0, 0, W, H);
  og.save(); og.translate(x, y); og.scale(sc, sc); og.font = font(fam, px); og.textAlign = align; og.textBaseline = 'alphabetic';
  og.fillStyle = fill; og.fillText(str, 0, 0); og.restore();
  og.globalCompositeOperation = 'source-atop';
  halftone(og, [0, 0, W, H], 22, .26, (xx, yy) => .25 + .75 * clamp((yy - (y - px * sc * .8)) / (px * sc * .9)), dotCol, .68);
  og.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(off, 0, 0); ctx.restore();
}

// ───────── texto ─────────
let TXT = [];
function boxOf(x, y, w, px) { const m = ctx.getTransform(); const p0 = m.transformPoint(new DOMPoint(x, y - px * .85)), p1 = m.transformPoint(new DOMPoint(x + w, y + px * .2)); return [p0.x, p0.y, p1.x, p1.y]; }
// manchete letra a letra: cai e achata, sombra de desregistro +8/+8 rosa
function headline(id, str, x, y, px, t, t0, o = {}) {
  if (t < t0) return 0;
  const fam = o.fam || 'slab', col = o.col || C.navy, sh = o.sh === undefined ? C.pink : o.sh, st = o.stagger ?? .045;
  ctx.font = font(fam, px); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const total = ctx.measureText(str).width; let cx = o.align === 'center' ? x - total / 2 : x;
  const x0 = cx;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], w = ctx.measureText(ch).width, u = t - t0 - i * st;
    if (u > 0 && ch !== ' ') {
      const a = back(u / .3, 2.2), dy = (1 - a) * -70, sq = 1 + .22 * Math.exp(-u * 9) * Math.cos(u * 34);
      ctx.save(); ctx.translate(cx + w / 2, y + dy); ctx.scale(1 / sq, sq);
      if (sh) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = sh; ctx.fillText(ch, -w / 2 + px * .05, px * .05); ctx.globalCompositeOperation = 'source-over'; }
      ctx.fillStyle = col; ctx.fillText(ch, -w / 2, 0); ctx.restore();
    }
    cx += w;
  }
  TXT.push({ id, text: str, box: boxOf(x0, y, total, px), pass: o.pass });
  return total;
}
function label(id, str, x, y, px, fam = 'mono', col = C.navy, align = 'left', o = {}) {
  ctx.font = font(fam, px); ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = col; ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width, x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  if (id) TXT.push({ id, text: str, box: boxOf(x0, y, w, px), pass: o.pass });
  return w;
}
function chip(id, str, x, y, px, bg, fg, align = 'left') {
  ctx.font = font('mono', px); const w = ctx.measureText(str).width + px * 1.3, h = px * 1.75;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x0, y - h / 2, w, h, h / 2); ctx.fill();
  label(id, str, x0 + px * .65, y + px * .36, px, 'mono', fg);
  return w;
}

// carimbo: retângulo duplo + texto, tinta comida por grão, ~93 %
const STAMPS = {};
function stampCanvas(str, col, px) {
  const key = str + col + px; if (STAMPS[key]) return STAMPS[key];
  const g0 = mkCanvas(10, 10).getContext('2d'); g0.font = font('arch', px);
  const tw = g0.measureText(str).width, w = Math.ceil(tw + px * 1.4), h = Math.ceil(px * 1.9);
  const c = mkCanvas(w + 20, h + 20), g = c.getContext('2d'); g.translate(10, 10);
  g.strokeStyle = col; g.lineWidth = px * .11; g.beginPath(); g.roundRect(px * .06, px * .06, w - px * .12, h - px * .12, px * .25); g.stroke();
  g.lineWidth = px * .045; g.beginPath(); g.roundRect(px * .24, px * .24, w - px * .48, h - px * .48, px * .16); g.stroke();
  g.fillStyle = col; g.font = font('arch', px); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(str, w / 2, h / 2 + px * .06);
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < w * h / 70; i++) { const r = hash(i * 7.7 + px) ** 3 * px * .09 + .6; g.globalAlpha = .35 + hash(i * 3.3) * .65; g.beginPath(); g.arc(hash(i * 1.3 + w) * w, hash(i * 2.9 + h) * h, r, 0, TAU); g.fill(); }
  for (let i = 0; i < (w + h) * 1.2; i++) { const e = i % 4, s = hash(i * 9.1); const x = e < 2 ? s * w : (e === 2 ? 0 : w), y = e < 2 ? (e === 0 ? 0 : h) : s * h; g.globalAlpha = 1; g.beginPath(); g.arc(x, y, hash(i * 5.5) * px * .09 + 1, 0, TAU); g.fill(); }
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  return (STAMPS[key] = c);
}
function stamp(id, str, x, y, px, rot, t, t0, col = C.red) {
  if (t < t0) return;
  const u = t - t0, s = u < .09 ? lerp(2.6, 1, ei(u / .09)) : 1 + .05 * Math.exp(-(u - .09) * 12) * Math.sin((u - .09) * 40);
  const c = stampCanvas(str, col, px);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180); ctx.scale(s, s);
  ctx.globalAlpha = .93 * clamp(u / .05); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(c, -c.width / 2, -c.height / 2); ctx.restore();
  TXT.push({ id, text: str, box: boxOf(x - c.width / 2, y + px * .4, c.width, px) });
}

// ───────── adereços ─────────
const popS = (t, t0, d = .38) => t < t0 ? 0 : back((t - t0) / d, 2);
function coin(x, y, r, t, spin = 0) {
  const sx = Math.abs(Math.cos(spin)) * .8 + .2;
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
  shape(circPts(0, 0, r), C.yellow, C.navy, Math.max(4, r * .14));
  ctx.lineWidth = Math.max(2, r * .07); ctx.strokeStyle = C.navy; ctx.beginPath(); ctx.arc(0, 0, r * .72, 0, TAU); ctx.stroke();
  if (r > 18) label(null, 'R$', 0, r * .3, r * .78, 'bagel', C.navy, 'center');
  ctx.restore();
}
function phoneShape(x, y, w, h, body, screen, outline) {
  shape(rrPts(x - w / 2, y - h / 2, w, h, w * .14), body, outline, 7);
  shape(rrPts(x - w / 2 + 20, y - h / 2 + 46, w - 40, h - 92, 14), screen, outline, 4);
  ctx.fillStyle = outline; ctx.beginPath(); ctx.roundRect(x - 30, y - h / 2 + 18, 60, 10, 5); ctx.fill();
}
function jersey(x, y, s, fill, txt) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const p = [[-70, -130], [-30, -140], [0, -118], [30, -140], [70, -130], [140, -70], [100, -20], [70, -45], [72, 130], [-72, 130], [-70, -45], [-100, -20], [-140, -70]];
  shape(p, fill);
  ctx.save(); path(p); ctx.clip(); ctx.fillStyle = C.cream; for (let i = -2; i <= 2; i++) ctx.fillRect(i * 56 - 10, -160, 20, 320); ctx.restore();
  shape(p, null); line([[-30, -140], [0, -100], [30, -140]], C.navy, 6);
  ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.roundRect(-66, -10, 132, 56, 10); ctx.fill(); ctx.strokeStyle = C.navy; ctx.lineWidth = 5; ctx.stroke();
  label(null, txt, 0, 31, 38, 'bagel', C.navy, 'center');
  ctx.restore();
}
function starburst(x, y, r, n, fill, rot = 0) {
  const p = []; for (let i = 0; i < n * 2; i++) { const a = rot + i / (n * 2) * TAU, rr = i % 2 ? r * .66 : r; p.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  shape(p, fill);
}
function person(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(0, -34, 15, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-20, -14, 40, 52, [16, 16, 4, 4]); ctx.fill(); ctx.restore();
}
function house(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  shape([[-70, -10], [0, -75], [70, -10], [55, -10], [55, 60], [-55, 60], [-55, -10]], C.cream);
  shape(rrPts(-18, 10, 36, 50, 4, 2), C.blue, C.navy, 5); shape(rrPts(25, 0, 22, 22, 3, 2), C.yellow, C.navy, 4);
  ctx.restore();
}
function cart(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  line([[-85, -50], [-60, -50], [-40, 30], [55, 30]], C.navy, 8);
  shape([[-55, -30], [75, -30], [60, 12], [-45, 12]], C.green);
  shape(circPts(-30, 52, 13, 14), C.navy, C.navy, 3); shape(circPts(40, 52, 13, 14), C.navy, C.navy, 3);
  shape(circPts(-10, -48, 16, 14), C.red, C.navy, 5); shape(rrPts(14, -70, 34, 40, 6, 2), C.yellow, C.navy, 5);

// ───────── quadro: fundo, HUD, legenda, transições, papel ─────────
function ground(col) { ctx.fillStyle = col; ctx.fillRect(-4000, -4000, 12000, 12000); }
function sceneAt(t) { let k = 0; for (let i = 0; i < S.length; i++) if (t >= S[i].t0) k = i; return k; }
function hud(t, sc) {
  if (sc.hud === false) return;
  const dark = sc.dark, fg = dark ? C.paper : C.navy, bg = dark ? C.paper : C.navy, tx = dark ? C.navy : C.paper;
  chip(null, 'PROCESSO Nº 14.790 · BETS', 40, 50, 22, bg, tx);
  if (sc.chap) { ctx.font = font('mono', 22); const w = ctx.measureText('PROCESSO Nº 14.790 · BETS').width + 22 * 1.3; chip(null, sc.chap, 40 + w + 14, 50, 22, C.yellow, C.navy); }
  const blink = Math.floor(t * 1.2) % 2 === 0;
  if (blink) { ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(W - 330, 50, 11, 0, TAU); ctx.fill(); }
  label(null, 'REC · ARQUIVO 2024', W - 40, 58, 22, 'mono', fg, 'right');
}
function caption(t) {
  const cue = TM.cues.find(c => t >= c.t0 && t < c.t1); if (!cue) return;
  const u = t - cue.t0, a = back(u / .3, 1.8), fo = clamp((cue.t1 - t) / .12);
  const keys = (L[cue.line].key || []).map(nrm);
  ctx.font = font('arch', 40);
  const words = cue.text.split(' '), sp = ctx.measureText(' ').width, ws = words.map(w => ctx.measureText(w).width);
  const tw = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1), pw = tw + 80, ph = 74, y = 990;
  // destaque: palavra cuja forma normalizada está numa expressão-chave
  const hi = words.map((w, i) => keys.some(k => { const n = nrm(w); return n && k.includes(n) && (n.length > 2 || /\d/.test(n)) && (k === n || k.split(' ').length > 1 || k.startsWith(n)); }));
  ctx.save(); ctx.translate(W / 2, y + (1 - a) * 40); ctx.scale(lerp(.85, 1, clamp(a)), 1); ctx.globalAlpha = fo;
  ctx.fillStyle = C.pink; ctx.beginPath(); ctx.roundRect(-pw / 2 + 8, -ph / 2 + 8, pw, ph, ph / 2); ctx.fill();
  ctx.fillStyle = C.navy; ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fill();
  let x = -tw / 2; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  words.forEach((w, i) => { ctx.fillStyle = hi[i] ? C.yellow : C.paper; ctx.fillText(w, x, 3); x += ws[i] + sp; });
  ctx.restore();
}
function wipes(t) {
  for (const c of CUTS) {
    if (c.hard) continue;
    const p = (t - (c.t - .24)) / .48; if (p <= 0 || p >= 1) continue;
    const G = 80, nx = Math.ceil(W / G), ny = Math.ceil(H / G);
    ctx.fillStyle = c.col; ctx.beginPath();
    for (let gy = 0; gy <= ny; gy++) for (let gx = 0; gx <= nx; gx++) {
      const o = ((gx / nx) + (gy / ny)) / 2 * .3 - .15, q = p - o, r = 62 * clamp((.5 - Math.abs(q - .5)) / (.5 - .17));
      if (r > .5) { const x = gx * G + G / 2, y = gy * G + G / 2; ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
    }
    ctx.fill();
  }
}
function grain(t) {
  const s = Math.floor(t * 15);
  ctx.fillStyle = 'rgba(242,232,213,.75)'; for (let i = 0; i < 320; i++) { const x = hash(i * 1.7 + s * 13.1) * W, y = hash(i * 2.3 + s * 7.7) * H; ctx.fillRect(x, y, 1 + hash(i + s) * 2.2, 1 + hash(i * 3 + s) * 2); }
  ctx.fillStyle = 'rgba(27,34,56,.55)'; for (let i = 0; i < 90; i++) { const x = hash(i * 5.1 + s * 3.3) * W, y = hash(i * 6.7 + s * 9.9) * H; ctx.fillRect(x, y, 1 + hash(i * 7 + s) * 2, 1 + hash(i * 9 + s) * 1.6); }
}

function render(t) {
  TXT = []; BOIL = Math.floor(t * 10); bc = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const k = sceneAt(t), sc = S[k];
  const cam = sc.cam ? sc.cam(t) : {}; const s = cam.s || 1;
  let sx = 0, sy = 0;
  for (const [t0, a, d] of SHAKES) { const u = (t - t0) / d; if (u > 0 && u < 1) { const m = a * (1 - u) ** 2; sx += Math.sin(t * 93) * m; sy += Math.cos(t * 71) * m; } }
  ctx.setTransform(s, 0, 0, s, W / 2 + sx - (W / 2 + (cam.x || 0)) * s, H / 2 + sy - (H / 2 + (cam.y || 0)) * s);
  sc.draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  hud(t, sc);
  caption(t);
  wipes(t);
  for (const [t0, pk] of FLASHES) { const u = (t - t0) / .3; if (u >= 0 && u < 1) { ctx.fillStyle = `rgba(255,255,255,${pk * (1 - u)})`; ctx.fillRect(0, 0, W, H); } }
  if (t > K.fade) { ctx.fillStyle = C.navy; ctx.globalAlpha = ss(seg(t, K.fade, DUR - .15)); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  grain(t);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(paperTex, 0, 0); ctx.globalCompositeOperation = 'source-over';
}

window.DUR = DUR; window.EV = EV; window.render = render; window.K = K;
